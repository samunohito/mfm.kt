name: initialize
description: 'Initialize Java, Gradle, and the project version'
outputs:
  version:
    description: 'Project version used by this build'
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: setup jdk
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'corretto'

    - name: setup gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: export version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${GITHUB_REF#refs/tags/v}"
        else
          version="$(sed -n 's/^version=//p' version.properties | tr -d '\r')"
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid project version" >&2
          exit 1
        fi
        printf 'version=%s\n' "$version" > version.properties
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
