name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: init
        uses: ./.github/actions/init

      - name: build and test
        uses: ./.github/actions/buildAndTest

  publish-release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: init
        id: init
        uses: ./.github/actions/init

      - name: jar
        run: ./gradlew :api:jar --no-daemon

      - name: release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.init.outputs.version }}
          artifacts: "api/build/libs/mfm-*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: publish
        run: ./gradlew :api:publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: init
        uses: ./.github/actions/init

      - name: generate docs
        run: ./gradlew dokkaHtml --no-daemon

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: mfm.kt docs
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
