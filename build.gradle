plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.jetbrains.dokka' version '2.3.0'
}

group = 'com.github.samunohito'

def versionProperties = new Properties()
versionProperties.load(new StringReader(providers.fileContents(layout.projectDirectory.file('version.properties')).asText.get()))
version = versionProperties.getProperty('version')

repositories {
    mavenCentral()
}

dependencies {
    dokka project(':api')
    implementation 'ch.qos.logback:logback-classic:1.6.6'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

test {
    useJUnitPlatform()
}

allprojects {
    plugins.withId('org.jetbrains.kotlin.jvm') {
        kotlin {
            jvmToolchain(21)
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
            }
        }
        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }
    }
}

dokka {
    moduleName = 'mfm.kt'
    dokkaPublications.html {
        outputDirectory = layout.buildDirectory.dir('dokka/html')
    }
    pluginsConfiguration.html {
        footerMessage = '(c) 2023 samunohito'
    }
}

// Retain the existing documentation entry point for local users.
tasks.register('dokkaHtml') {
    group = 'documentation'
    dependsOn tasks.named('dokkaGeneratePublicationHtml')
}
